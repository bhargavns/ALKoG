[tool.poetry]
name = "alkog"
version = "0.1.0"
description = "ALKoG: Active Learning Knowledge Graph-based framework for emergent symbolic grounding"
authors = ["Bhargav Shandilya"]
readme = "README.md"
packages = [{ include = "alkog" }]

[tool.poetry.dependencies]
python          = "^3.11"
torch           = "^2.3"
torchvision     = "^0.18"
torch-geometric = "^2.5"
gymnasium       = "^0.29"
networkx        = "^3.3"
pydantic        = "^2.7"
pydantic-settings = "^2.3"
pyyaml          = "^6.0"
wandb           = "^0.17"
numpy           = "^1.26"
rich            = "^13.7"
typer           = "^0.12"
websockets      = "^12.0"   # Godot bridge (Block 11)

[tool.poetry.group.dev.dependencies]
pytest      = "^8.0"
pytest-cov  = "^5.0"
black       = "^24.0"
ruff        = "^0.4"
mypy        = "^1.10"

[tool.poetry.scripts]
alkog-train = "scripts.train:app"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version  = "3.11"
strict          = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "--cov=alkog --cov-report=term-missing"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
